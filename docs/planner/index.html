<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session planner | Workshop sample</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Workshop sample / Fictional agenda</p>
      <h1>Session planner</h1>
      <p>Browse six sample talks and save the ones you want to attend. Your picks last until you reload.</p>
    </header>
    <section aria-labelledby="schedule">
      <h2 id="schedule">Schedule</h2>
      <label for="track-filter">Track</label>
      <select id="track-filter">
        <option value="all">All tracks</option>
      </select>
      <p id="count" role="status"></p>
      <ul id="sessions" class="cards"></ul>
      <noscript>Enable JavaScript to view the sample schedule.</noscript>
    </section>
  </main>
</body>
</html>
